<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="color-scheme" content="light dark" />
		<title>Milu</title>
		<script src="/boot.js"></script>
		<style>
			/* Only the tokens, the faces and the keys are global. Every rule that shapes the boot frame is nested
			   under #boot, so it cannot reach the app that mounts into #root once the frame is gone. */
			:root {
				color-scheme: light dark;
				--canvas: light-dark(#faf9f5, #181715);
				--chrome: light-dark(#f5f0e8, #1f1e1b);
				--surface: light-dark(#faf9f5, #252320);
				--ink: light-dark(#141413, #faf9f5);
				--ink-soft: light-dark(#6c6a64, #a09d96);
				--muted: light-dark(#6c6a64, #8b8880);
				--muted-soft: light-dark(#8e8b82, #6e6b64);
				--line: light-dark(#e6dfd8, color-mix(in srgb, #faf9f5 12%, transparent));
				--line-strong: light-dark(#c4beb3, #4a4640);
				--hover: color-mix(in srgb, var(--ink) 7%, transparent);
				--measure: clamp(720px, 64vw, 980px);
				--boot-list: 240px;
				--sans: "Public Sans", ui-sans-serif, system-ui, sans-serif;
				--mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
				--ease-out: cubic-bezier(0.16, 1, 0.3, 1);
				--reveal: cubic-bezier(0.4, 0, 0.2, 1);
			}

			@font-face {
				font-family: "Public Sans";
				src: url("/fonts/public-sans.woff2") format("woff2-variations");
				font-weight: 100 900;
				font-display: swap;
			}

			@font-face {
				font-family: "JetBrains Mono";
				src: url("/fonts/jetbrains-mono.woff2") format("woff2-variations");
				font-weight: 100 800;
				font-display: swap;
			}

			html,
			body {
				height: 100%;
				margin: 0;
				background: var(--canvas);
			}

			#root {
				height: 100%;
			}

			#boot {
				position: fixed;
				inset: 0;
				background: var(--canvas);
				color: var(--ink);
				font-family: var(--sans);
				transition: opacity 120ms linear;

				/* ——— the shell, drawn with the geometry the app will paint ——— */
				& .boot-shell {
					display: grid;
					grid-template-columns: var(--boot-list) minmax(0, 1fr);
					height: 100%;
				}

				& .boot-rail {
					display: flex;
					flex-direction: column;
					min-height: 0;
					padding: 0 12px;
					overflow: hidden;
					border-right: 1px solid var(--line);
					background: var(--chrome);
				}

				& .boot-rail-head {
					display: flex;
					flex: none;
					align-items: center;
					justify-content: flex-end;
					gap: 8px;
					height: 52px;
					padding-left: 76px;
					color: var(--muted-soft);
					-webkit-app-region: drag;

					& span {
						display: grid;
						place-items: center;
						opacity: 0.35;
					}
				}

				& .boot-rail-id {
					display: flex;
					flex: none;
					align-items: center;
					gap: 12px;
					height: 44px;
					border-bottom: 1px solid var(--line);
					color: var(--ink);

					& img {
						width: 26px;
						height: 26px;
						border-radius: 6px;
						opacity: 0.35;
					}

					& svg {
						height: 20px;
						width: auto;
						opacity: 0.35;
					}
				}

				& .boot-rail-rows {
					display: flex;
					flex-direction: column;
					gap: 2px;
					padding-top: 8px;
				}

				& .boot-rail-row {
					display: flex;
					align-items: center;
					gap: 10px;
					padding: 9px 12px 9px 8px;

					& span:first-child {
						flex: none;
						width: 34px;
						height: 34px;
						border-radius: 999px;
						background: color-mix(in srgb, var(--line) 40%, transparent);
					}

					& span:last-child {
						display: flex;
						flex: 1;
						min-width: 0;
						flex-direction: column;
						gap: 11px;
					}

					& i {
						display: block;
						width: 52%;
						height: 13px;
						border-radius: 4px;
						background: color-mix(in srgb, var(--line) 40%, transparent);

						&:last-child {
							width: 78%;
							height: 11px;
						}
					}
				}

				& .boot-main {
					display: flex;
					flex-direction: column;
					min-height: 0;
				}

				& .boot-chat-bar {
					display: flex;
					flex: none;
					align-items: center;
					height: 52px;
					-webkit-app-region: drag;
				}

				& .boot-chat-frame {
					display: flex;
					flex: 1;
					min-height: 0;
					flex-direction: column;
					align-items: center;
					justify-content: center;
					padding: 22px 24px 12px;
				}

				& .boot-turns {
					display: flex;
					flex-direction: column;
					gap: 22px;
					width: var(--measure);
					max-width: 100%;
				}

				& .boot-turn {
					display: flex;
					flex-direction: column;
					gap: 9px;

					&.is-user {
						align-items: flex-end;
					}

					& i {
						display: block;
						width: 68%;
						height: 12px;
						border-radius: 4px;
						background: color-mix(in srgb, var(--line) 45%, transparent);
						animation: boot-pulse 1.4s ease-in-out infinite;

						&.is-short {
							width: 44%;
							animation-delay: 0.15s;
						}

						&:nth-child(2) {
							animation-delay: 0.15s;
						}

						&:nth-child(3) {
							animation-delay: 0.3s;
						}
					}

					&.is-user i {
						width: 38%;
						height: 34px;
						border-radius: 6px;
					}
				}

				& .boot-composer-slot {
					display: flex;
					flex: none;
					justify-content: center;
					padding: 0 24px 12px;
				}

				& .boot-composer {
					display: flex;
					flex-direction: column;
					gap: 10px;
					width: calc(var(--measure) + 32px);
					max-width: 100%;
					padding: 12px 16px 8px;
					border: 1px solid var(--line);
					border-radius: 12px;
					background: var(--surface);

					& p {
						margin: 0;
						font-size: 14px;
						line-height: 20px;
						color: var(--muted);
					}

					& div {
						display: flex;
						align-items: center;
						gap: 6px;
						height: 26px;
						padding: 0 2px;
					}

					& div span {
						width: 26px;
						height: 26px;
						border-radius: 999px;
						background: color-mix(in srgb, var(--line) 45%, transparent);
						animation: boot-pulse 1.4s ease-in-out infinite;

						&:last-child {
							width: 68px;
							animation-delay: 0.15s;
						}
					}
				}

				/* ——— the hold screen: the whole window, one faint mark, nothing else ——— */
				& .boot-hold {
					position: absolute;
					inset: 0;
					background: color-mix(in srgb, var(--canvas) 90%, transparent);
					opacity: 0;
					pointer-events: none;
					transition: opacity 320ms var(--reveal);
					-webkit-app-region: drag;
					--hold-w: 314px;

					&.is-visible {
						opacity: 1;
						pointer-events: auto;
					}

					& svg {
						position: absolute;
						top: 50%;
						left: 50%;
						translate: -50% -50%;
						width: var(--hold-w);
						height: auto;
						color: var(--ink);
						opacity: 0;
						transition: opacity 560ms var(--reveal);

						& path {
							opacity: 0.22;
						}
					}

					&.is-visible svg {
						opacity: 1;

						& path {
							animation: boot-breathe 2.4s ease-in-out infinite;
						}
					}

					& button {
						position: absolute;
						top: calc(50% + var(--hold-w) * 63.88 / 193.71 / 2 + 34px);
						left: 50%;
						translate: -50% 0;
						height: 30px;
						padding: 0 14px;
						border: 1px solid var(--line);
						border-radius: 6px;
						background: transparent;
						color: var(--ink-soft);
						font-family: var(--mono);
						font-size: 10px;
						letter-spacing: 0.08em;
						text-transform: uppercase;
						cursor: pointer;
						-webkit-app-region: no-drag;
						animation: boot-in 320ms var(--reveal) both;
						transition:
							color 120ms var(--ease-out),
							border-color 120ms var(--ease-out),
							background-color 120ms var(--ease-out);

						&:hover {
							color: var(--ink);
							border-color: var(--line-strong);
							background: var(--hover);
						}
					}
				}

				/* Reduce motion stops the loops and the travel, not the fades: an opacity ramp is not motion. */
				@media (prefers-reduced-motion: reduce) {
					& .boot-turn i,
					& .boot-composer div span {
						animation: none;
						opacity: 0.7;
					}

					& .boot-hold.is-visible svg path {
						opacity: 0.45;
						animation: none;
					}

					& .boot-hold button {
						animation-name: boot-fade;
					}
				}
			}

			/* A closed list is a document-level flag, so this one selector stays outside the frame. */
			html[data-boot-list="closed"] #boot .boot-rail {
				display: none;
			}

			@keyframes boot-pulse {
				0%,
				100% {
					opacity: 0.5;
				}
				50% {
					opacity: 1;
				}
			}

			@keyframes boot-breathe {
				0%,
				100% {
					opacity: 0.22;
				}
				50% {
					opacity: 0.6;
				}
			}

			@keyframes boot-in {
				from {
					opacity: 0;
					transform: translateY(4px);
				}
			}

			@keyframes boot-fade {
				from {
					opacity: 0;
				}
			}
		</style>
	</head>
